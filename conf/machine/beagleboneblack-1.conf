#@TYPE: Machine
#@NAME: beagleboneblack-1
#@DESCRIPTION: BeagleBoard Hardware to crosscheck PHYTEC software, rev. A5C 2GB eMMC
# (Falls du kein Initramfs nutzt, ansonsten hier das Format eintragen)
#@ARTICLENUMBERS:

IMAGE_FSTYPES ?= "tar.gz tar.bz2 wic.xz wic.bmap emmc"

require conf/machine/include/phyam335x.inc

# Kernel
#KERNEL_DEVICETREE = "am335x-boneblack.dtb"
DTB_FILES = "am335x-boneblack.dtb"
KERNEL_DEVICETREE = "ti/omap/${DTB_FILES}"

# Set the hardware defconfig target for BeagleBone Black
UBOOT_MACHINE = "am335x_evm_defconfig"

# Target bootloader output binary names generated by the U-Boot recipe
UBOOT_BINARY = "u-boot.img"
UBOOT_IMAGE = "u-boot-${MACHINE}-${PV}-${PR}.${UBOOT_SUFFIX}"
SPL_BINARY = "MLO"

# Barebox
#BAREBOX_BIN = "images/barebox-am33xx-beaglebone.img"
#BAREBOX_IPL_BIN = "images/barebox-am33xx-beaglebone-mlo.img"

MACHINE_FEATURES += "gpu emmc"

# Phytec partup packaging support for BeagleBone Black
#IMAGE_CLASSES:append = " image-types-partup"
#PARTUP_PACKAGE_FILES = "${IMAGE_LINK_NAME}.ext4"

