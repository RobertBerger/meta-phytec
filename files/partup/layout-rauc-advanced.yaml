api-version: 1
disklabel: msdos

mmc:
  boot-partitions:
    enable: 1
    binaries:
      - input-offset: 0kiB
        output-offset: ${BOOTLOADER_SEEK_EMMC}kiB
        input:
          filename: ${BOOTLOADER_FILE}
          sha256sum: ${@partup_sha256sum(d.getVar('BOOTLOADER_FILE'), d)}

raw:
  - input-offset: ${BOOTLOADER_SKIP}kiB
    output-offset: ${BOOTLOADER_SEEK}kiB
    input:
      filename: ${BOOTLOADER_FILE}
      sha256sum: ${@partup_sha256sum(d.getVar('BOOTLOADER_FILE'), d)}

# BEGIN_CLEAN
clean:
  - offset: ${UBOOT_ENV_OFFSET}
    size: 64kiB
  - offset: ${UBOOT_ENV_OFFSET_REDUND}
    size: 64kiB
# END_CLEAN
partitions:
  - label: boot0
    type: primary
    filesystem: fat32
    size: 128MiB
    offset: ${BOOT_PART_OFFSET}
    input: # ARRAY_IMAGE_BOOT_FILES
      - filename: @KEY@ # ARRAY_IMAGE_BOOT_FILES

  - label: boot1
    type: primary
    filesystem: fat32
    size: 128MiB
    input: # ARRAY_IMAGE_BOOT_FILES
      - filename: @KEY@ # ARRAY_IMAGE_BOOT_FILES

  - label: config
    type: primary
    filesystem: null
    size: 64MiB
    input:
      - filename: config-partition.ext4

  - label: root0
    type: logical
    filesystem: null
    size: 8GiB
    block-size: 4kiB
    input:
      - filename: ${IMAGE_LINK_NAME}.ext4

  - label: root1
    type: logical
    filesystem: null
    size: 8GiB
    block-size: 4kiB
    input:
      - filename: ${IMAGE_LINK_NAME}.ext4

  - label: etc-overlay
    type: logical
    filesystem: ext4
    size: 512MiB

  - label: genericoverlay
    type: logical
    filesystem: ext4
    size: 2GiB

  - label: persistent-data
    type: logical
    filesystem: ext4
    size: 10GiB

  - label: artifacts
    type: logical
    filesystem: ext4
    expand: true          
