api-version: 1
disklabel: msdos

mmc:
  boot-partitions:
    enable: 0

raw:
  - input-offset: 0kiB
    output-offset: 128kiB
    input:
      filename: MLO
      sha256sum: ${@partup_sha256sum('MLO', d)}
  - input-offset: 0kiB
    output-offset: 256kiB
    input:
      filename: MLO
      sha256sum: ${@partup_sha256sum('MLO', d)}
  - input-offset: 0kiB
    output-offset: 384kiB
    input:
      filename: u-boot.img
      sha256sum: ${@partup_sha256sum('u-boot.img', d)}

# BEGIN_CLEAN
clean:
  - offset: 3840kiB
    size: 64kiB
  - offset: 3968kiB
    size: 64kiB
# END_CLEAN

# BEGIN_PARTITIONS
partitions:
  - label: boot
    type: primary
    filesystem: fat32
    flags:
      - boot
      - lba
    size: 128MiB
    offset: 4MiB
    input: # ARRAY_IMAGE_BOOT_FILES
      - filename: @KEY@ # ARRAY_IMAGE_BOOT_FILES

  - label: root
    type: primary
    filesystem: null
    expand: true
    block-size: 4kiB
    input:
      - filename: ${IMAGE_LINK_NAME}.ext4
# END_PARTITIONS
